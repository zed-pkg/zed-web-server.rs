name: Zed latest dependency gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZED_PKG_INTERACTIVE: "false"
      GITHUB_TOKEN: "${{ github.token }}"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ZED_CLI_COMMIT: afb74f9827d3501d01227e58025331df9fa4b833
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out pinned fixed Zed CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: .zed-cli-source
          persist-credentials: false
      - name: Build and install pinned fixed Zed CLI
        shell: bash
        working-directory: .zed-cli-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zed --version
      - run: bash .githooks/pre-push --ci
