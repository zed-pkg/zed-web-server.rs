name: one-shot DEN-3477 minimap hardening

on:
  push:
    branches:
      - agent/den-3477-claritas-visual-search
    paths:
      - .github/workflows/one-shot-den-3477-minimap-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-den-3477-minimap-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-3477-claritas-visual-search
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: .node-version
      - name: Apply bounded minimap and module-import assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          core_path = Path("static/dependency-graph-insights-core.js")
          core = core_path.read_text()
          core = replace_once(
              core,
              '''  const minimapViewport = Object.freeze({
            x: clamp(rawViewport.x, 0, width),
            y: clamp(rawViewport.y, 0, height),
            width: clamp(rawViewport.width, 1, width),
            height: clamp(rawViewport.height, 1, height),
          });''',
              '''  const minimapViewportWidth = clamp(rawViewport.width, 1, width);
          const minimapViewportHeight = clamp(rawViewport.height, 1, height);
          const minimapViewport = Object.freeze({
            x: clamp(rawViewport.x, 0, Math.max(0, width - minimapViewportWidth)),
            y: clamp(rawViewport.y, 0, Math.max(0, height - minimapViewportHeight)),
            width: minimapViewportWidth,
            height: minimapViewportHeight,
          });''',
              "minimap viewport containment",
          )
          core_path.write_text(core)

          test_path = Path("tests/dependency-graph-insights.mjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''assert.ok(geometry.viewport.height >= 1 && geometry.viewport.height <= 118);
          const center = geometry.worldAt(geometry.points.get("middle").x, geometry.points.get("middle").y);''',
              '''assert.ok(geometry.viewport.height >= 1 && geometry.viewport.height <= 118);
          assert.ok(geometry.viewport.x + geometry.viewport.width <= 196);
          assert.ok(geometry.viewport.y + geometry.viewport.height <= 118);
          const clippedGeometry = minimapGeometry(
            new Map([
              ["left", { x: -100, y: -50 }],
              ["right", { x: 100, y: 50 }],
            ]),
            { x: -10000, y: -10000, k: 2 },
            { width: 20, height: 20 },
            { width: 196, height: 118, padding: 10 }
          );
          assert.ok(clippedGeometry.viewport.x + clippedGeometry.viewport.width <= 196);
          assert.ok(clippedGeometry.viewport.y + clippedGeometry.viewport.height <= 118);
          const center = geometry.worldAt(geometry.points.get("middle").x, geometry.points.get("middle").y);''',
              "minimap boundary assertions",
          )
          tests = replace_once(
              tests,
              '''assert.ok(styleSource.includes("prefers-reduced-motion"));
          
          console.log("dependency graph visual-search tests passed");''',
              '''assert.ok(styleSource.includes("prefers-reduced-motion"));
          const pluginModule = await import(
            new URL("../static/dependency-graph-insights.js", import.meta.url)
          );
          assert.equal(typeof pluginModule.updateVisualSearch, "function");
          assert.equal(typeof pluginModule.renderMinimap, "function");
          
          console.log("dependency graph visual-search tests passed");''',
              "executable module import assertions",
          )
          test_path.write_text(tests)
          PY
      - name: Verify hardened modules
        run: |
          node --check static/dependency-graph-insights-core.js
          node --check static/dependency-graph-insights.js
          node tests/dependency-graph-insights.mjs
          git diff --check
      - name: Commit the hardening and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-den-3477-minimap-hardening.yml
          git add static/dependency-graph-insights-core.js tests/dependency-graph-insights.mjs
          git commit -m 'test(graph): harden minimap boundaries and module loading'
          git push origin HEAD:agent/den-3477-claritas-visual-search
