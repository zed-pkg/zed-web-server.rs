name: diagnose account console check

on:
  push:
    branches:
      - feat/den-2955-mash-account-console
    paths:
      - .github/workflows/diagnose-account-console-check.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.repository == 'zed-pkg/zed-web-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Capture compiler output
        id: check
        shell: bash
        run: |
          set +e
          cargo check --locked --all-targets --message-format short >"$RUNNER_TEMP/check.log" 2>&1
          status=$?
          tail -c 14000 "$RUNNER_TEMP/check.log" >"$RUNNER_TEMP/check-tail.log"
          payload="$(base64 -w0 < "$RUNNER_TEMP/check-tail.log")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/10/comments" \
            -f body="ACCOUNT_CONSOLE_CHECK_DIAGNOSTIC protocol=1 head=${GITHUB_SHA} status=${status} data=${payload}" >/dev/null
          exit "$status"
        env:
          GH_TOKEN: ${{ github.token }}
