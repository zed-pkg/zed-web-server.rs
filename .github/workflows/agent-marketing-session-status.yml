name: Apply token-blind marketing session endpoints

on:
  push:
    branches:
      - agent/marketing-session-status-20260810
    paths:
      - .github/workflows/agent-marketing-session-status.yml

permissions:
  contents: write

concurrency:
  group: agent-marketing-session-status
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          auth_path = Path("src/browser_auth.rs")
          auth = auth_path.read_text()
          auth = replace_once(
              auth,
              "use axum::http::{HeaderMap, HeaderValue, Method, StatusCode, header};",
              "use axum::http::{HeaderMap, HeaderName, HeaderValue, Method, StatusCode, header};",
              "header import",
          )
          auth = replace_once(
              auth,
              "const LOGIN_STATE_MAX_AGE_SECONDS: i64 = 10 * 60;\nconst SESSION_MAX_AGE_SECONDS: i64 = 30 * 24 * 60 * 60;",
              "const LOGIN_STATE_MAX_AGE_SECONDS: i64 = 10 * 60;\nconst SESSION_MAX_AGE_SECONDS: i64 = 30 * 24 * 60 * 60;\nconst SESSION_REFRESH_AFTER_SECONDS: u64 = 50 * 60;\nconst MARKETING_ORIGIN: &str = \"https://zpkg.net\";",
              "marketing constants",
          )
          auth = replace_once(
              auth,
              "#[derive(Debug, Deserialize)]\nstruct DelegateResponse {\n    access_token: String,\n}\n",
              "#[derive(Debug, Deserialize)]\nstruct DelegateResponse {\n    access_token: String,\n}\n\n/// Token-blind response consumed by the static `zpkg.net` header.\n#[derive(Debug, Serialize)]\n#[serde(rename_all = \"camelCase\")]\nstruct MarketingSessionStatus {\n    authenticated: bool,\n    refresh_after_seconds: u64,\n}\n",
              "status response type",
          )

          handlers = r'''
/// Report only whether a valid signed product session exists. The static site
/// never receives a principal, access token, refresh handle, or account data.
pub async fn marketing_session_status(
    State(state): State<Arc<WebState>>,
    headers: HeaderMap,
) -> Response {
    let Some(config) = auth_config(&state) else {
        return auth_unavailable();
    };
    if !marketing_origin_allowed(&headers, config) {
        return error_json(StatusCode::FORBIDDEN, "cross-origin session probe rejected");
    }

    let session = read_signed_cookie::<BrowserSession>(
        &headers,
        &config.session_cookie_name,
        config,
    );
    let authenticated = session.as_ref().is_some_and(session_is_current);
    let mut response = marketing_status_response(
        config,
        &headers,
        StatusCode::OK,
        authenticated,
    );
    if !authenticated && cookie_value(&headers, &config.session_cookie_name).is_some() {
        append_cookie(
            &mut response,
            clear_cookie(&config.session_cookie_name, config),
        );
    }
    response
}

/// Rotate the opaque Shared Auth refresh handle inside the signed HttpOnly
/// product cookie. No bearer or refresh material is included in the response.
pub async fn marketing_session_refresh(
    State(state): State<Arc<WebState>>,
    headers: HeaderMap,
) -> Response {
    let Some(config) = auth_config(&state) else {
        return auth_unavailable();
    };
    if !marketing_origin_allowed(&headers, config) {
        return error_json(StatusCode::FORBIDDEN, "cross-origin session refresh rejected");
    }

    let Some(session) = read_signed_cookie::<BrowserSession>(
        &headers,
        &config.session_cookie_name,
        config,
    )
    .filter(session_is_current)
    else {
        let mut response = marketing_status_response(
            config,
            &headers,
            StatusCode::OK,
            false,
        );
        if cookie_value(&headers, &config.session_cookie_name).is_some() {
            append_cookie(
                &mut response,
                clear_cookie(&config.session_cookie_name, config),
            );
        }
        return response;
    };

    match refresh(&state, config, &session).await {
        Ok(refreshed) => {
            let next_session = BrowserSession {
                refresh_token: refreshed.refresh_token,
                shared_user_id: refreshed.shared_user_id,
                issued_at: Utc::now().timestamp(),
            };
            let mut response = marketing_status_response(
                config,
                &headers,
                StatusCode::OK,
                true,
            );
            append_cookie(
                &mut response,
                signed_cookie(
                    &config.session_cookie_name,
                    &next_session,
                    SESSION_MAX_AGE_SECONDS,
                    config,
                ),
            );
            response
        }
        Err(upstream)
            if matches!(
                upstream.status(),
                StatusCode::BAD_REQUEST | StatusCode::UNAUTHORIZED | StatusCode::FORBIDDEN
            ) =>
        {
            let mut response = marketing_status_response(
                config,
                &headers,
                StatusCode::OK,
                false,
            );
            append_cookie(
                &mut response,
                clear_cookie(&config.session_cookie_name, config),
            );
            response
        }
        Err(_) => marketing_status_response(
            config,
            &headers,
            StatusCode::SERVICE_UNAVAILABLE,
            false,
        ),
    }
}

fn session_is_current(session: &BrowserSession) -> bool {
    let age = Utc::now().timestamp() - session.issued_at;
    (0..=SESSION_MAX_AGE_SECONDS).contains(&age)
}

fn marketing_origin_allowed(headers: &HeaderMap, config: &BrowserAuthConfig) -> bool {
    headers
        .get(header::ORIGIN)
        .and_then(|value| value.to_str().ok())
        .is_some_and(|origin| origin == MARKETING_ORIGIN || origin == config.public_origin)
}

fn marketing_status_response(
    config: &BrowserAuthConfig,
    request_headers: &HeaderMap,
    status: StatusCode,
    authenticated: bool,
) -> Response {
    let mut response = (
        status,
        axum::Json(MarketingSessionStatus {
            authenticated,
            refresh_after_seconds: SESSION_REFRESH_AFTER_SECONDS,
        }),
    )
        .into_response();
    let headers = response.headers_mut();
    headers.insert(
        header::CACHE_CONTROL,
        HeaderValue::from_static("no-store, max-age=0"),
    );
    headers.insert(header::PRAGMA, HeaderValue::from_static("no-cache"));
    headers.insert(
        HeaderName::from_static("cross-origin-resource-policy"),
        HeaderValue::from_static("same-site"),
    );
    headers.append(header::VARY, HeaderValue::from_static("Origin"));

    if request_headers
        .get(header::ORIGIN)
        .and_then(|value| value.to_str().ok())
        == Some(MARKETING_ORIGIN)
    {
        headers.insert(
            header::ACCESS_CONTROL_ALLOW_ORIGIN,
            HeaderValue::from_static(MARKETING_ORIGIN),
        );
        headers.insert(
            header::ACCESS_CONTROL_ALLOW_CREDENTIALS,
            HeaderValue::from_static("true"),
        );
    }
    debug_assert!(marketing_origin_allowed(request_headers, config));
    response
}

'''
          auth = replace_once(
              auth,
              "pub async fn create_org(\n",
              handlers + "pub async fn create_org(\n",
              "marketing handlers",
          )

          tests = r'''

    #[test]
    fn marketing_status_contract_is_token_blind_and_uses_fifty_minutes() {
        let payload = serde_json::to_string(&MarketingSessionStatus {
            authenticated: true,
            refresh_after_seconds: SESSION_REFRESH_AFTER_SECONDS,
        })
        .unwrap();
        assert_eq!(
            payload,
            "{\"authenticated\":true,\"refreshAfterSeconds\":3000}"
        );
        for forbidden in ["token", "email", "subject", "user"] {
            assert!(!payload.contains(forbidden), "{forbidden}");
        }
    }

    #[test]
    fn marketing_origin_is_exact_and_never_wildcarded() {
        let config = config();
        let mut headers = HeaderMap::new();
        headers.insert(header::ORIGIN, HeaderValue::from_static(MARKETING_ORIGIN));
        assert!(marketing_origin_allowed(&headers, &config));

        headers.insert(
            header::ORIGIN,
            HeaderValue::from_static("https://evil.zpkg.net"),
        );
        assert!(!marketing_origin_allowed(&headers, &config));

        headers.insert(
            header::ORIGIN,
            HeaderValue::from_static("https://app.zpkg.net"),
        );
        assert!(marketing_origin_allowed(&headers, &config));
    }
'''
          auth = replace_once(
              auth,
              "    #[test]\n    fn sha256_matches_the_standard_abc_vector() {",
              tests + "\n    #[test]\n    fn sha256_matches_the_standard_abc_vector() {",
              "marketing tests",
          )
          auth_path.write_text(auth)

          routes_path = Path("src/routes/mod.rs")
          routes = routes_path.read_text()
          routes = replace_once(
              routes,
              "        .route(\"/auth/shared/callback\", get(browser_auth::callback))\n        .route(\"/auth/logout\", post(browser_auth::logout))",
              "        .route(\"/auth/shared/callback\", get(browser_auth::callback))\n        .route(\n            \"/auth/session/status\",\n            get(browser_auth::marketing_session_status),\n        )\n        .route(\n            \"/auth/session/refresh\",\n            post(browser_auth::marketing_session_refresh),\n        )\n        .route(\"/auth/logout\", post(browser_auth::logout))",
              "marketing routes",
          )
          routes_path.write_text(routes)

          docs = Path("docs/marketing-session-contract.md")
          docs.parent.mkdir(parents=True, exist_ok=True)
          docs.write_text("""# Marketing session contract\n\nThe static `zpkg.net` site never reads a JWT, Shared Auth access token, delegated registry bearer, or opaque refresh handle. It uses credentialed same-site requests to the Rust BFF at `app.zpkg.net`:\n\n- `GET /auth/session/status` returns only `{ authenticated, refreshAfterSeconds }`.\n- `POST /auth/session/refresh` rotates the opaque Shared Auth refresh handle inside the signed, HttpOnly, host-only product cookie.\n- Credentialed CORS is emitted only for the exact `https://zpkg.net` origin; wildcard origins are forbidden.\n- Responses are `no-store` and include no principal or account data.\n- Web clients check on initial load, focus, visibility, and online recovery, with a 50-minute foreground timer and best-effort Periodic Background Sync.\n- Mobile clients use the same 50-minute target only when the OS grants background execution and always refresh on foreground/resume.\n\nDeployment remains gated on the exact-head Shared Auth PKCE/handoff migration and client provisioning documented by the existing marketing-route PR.\n""")
          PY

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          ! grep -R -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' --exclude-dir=.git .
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Commit tested source and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketing-session-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-marketing-session-status.yml
          git add src/browser_auth.rs src/routes/mod.rs docs/marketing-session-contract.md
          git commit -m "feat(auth): expose token-blind marketing session refresh"
          git push origin HEAD:${GITHUB_REF_NAME}
