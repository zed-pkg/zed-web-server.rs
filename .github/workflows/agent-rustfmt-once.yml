name: agent rustfmt once

on:
  push:
    branches:
      - agent/den-3472-projection-hardening

permissions:
  contents: write

concurrency:
  group: agent-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply and constrain rustfmt delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          printf 'rustfmt changed: %s\n' "${changed[*]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              *.rs) ;;
              *) echo "unexpected non-Rust rustfmt delta: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check
      - name: Commit exact formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(graph): apply rustfmt to projection hardening"
          git push origin "HEAD:${GITHUB_REF_NAME}"
