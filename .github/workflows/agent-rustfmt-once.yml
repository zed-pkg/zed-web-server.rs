name: agent rustfmt once

on:
  push:
    branches:
      - agent/den-3472-projection-hardening

permissions:
  contents: write

concurrency:
  group: agent-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply and constrain rustfmt delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "src/routes/dependency_graph.rs"
          git diff --check
      - name: Commit exact formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dependency_graph.rs
          git commit -m "style(graph): apply rustfmt to exact version reads"
          git push origin "HEAD:${GITHUB_REF_NAME}"
