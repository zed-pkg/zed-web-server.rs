# Fast Rust CI: pinned source graph, mold as the linker, cargo-nextest for
# parallel tests, and a dependency cache that degrades gracefully.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZED_INTERFACES_SHA: 07d01604461d00e237c7d86ad3855464167574ec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - name: Verify the complete source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: zed-web-server.rs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6e08638ce5ee7b285b1e051c006e3be64fcff91 # nextest
      - name: Format
        run: cargo fmt --check
        working-directory: zed-web-server.rs
      - name: Test (nextest)
        run: cargo nextest run
        working-directory: zed-web-server.rs
