# Fast Rust CI (zed-docs issue #8): rust-cache cross-run compile caching, mold as the linker, and cargo-nextest for parallel tests. The
# toolchain is pinned via rust-toolchain.toml so the cache key stays stable.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-web-server.rs
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@v1
        with:
          make-default: true
      # sccache was removed after repeated GitHub cache-service outages took
      # CI down mid-build (even health-probed); rust-cache below degrades
      # gracefully during outages and covers the cross-run caching need.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-web-server.rs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --check
        working-directory: zed-web-server.rs
      - name: Test (nextest)
        run: cargo nextest run
        working-directory: zed-web-server.rs
      # No doctest step: this crate is bin-only (no library target), and
      # `cargo test --doc` errors rather than no-ops on bin-only packages.
