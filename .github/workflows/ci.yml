# Fast Rust CI: pinned source graph, mold as the linker, cargo-nextest for
# parallel tests, and a dependency cache that degrades gracefully.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZED_INTERFACES_SHA: 4d40ae96f5ce6240356ad4fa5e455d0310b1c97d
  ZED_LIB_CORE_SHA: 18fd49ba4d73689a941eaa56ef20a12a6c90a993

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-web-server.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-lib-core
          ref: ${{ env.ZED_LIB_CORE_SHA }}
          path: zed-lib-core
          persist-credentials: false
      - name: Verify the complete source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
          test "$(git -C zed-lib-core rev-parse HEAD)" = "$ZED_LIB_CORE_SHA"
          cd zed-web-server.rs
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = Path("Cargo.lock").read_text()
          pins = {
              "zed-interfaces": (
                  "https://github.com/zed-pkg/zed-interfaces.git",
                  os.environ["ZED_INTERFACES_SHA"],
              ),
              "zed-orm-core": (
                  "https://github.com/zed-pkg/zed-lib-core.git",
                  os.environ["ZED_LIB_CORE_SHA"],
              ),
          }
          for package, (repository, revision) in pins.items():
              spec = manifest["dependencies"][package]
              assert "path" not in spec, spec
              assert spec["git"] == repository, spec
              assert spec["rev"] == revision, spec
              source = f"git+{repository}?rev={revision}#{revision}"
              assert source in lock, f"Cargo.lock does not pin {package} at {revision}"
          PY
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: zed-web-server.rs/.github/workflows/ci.yml zed-web-server.rs/.github/workflows/publish-container.yml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: zed-web-server.rs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6e08638ce5ee7b285b1e051c006e3be64fcff91 # nextest
      - name: Resolve only the committed lockfile
        working-directory: zed-web-server.rs
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Verify dependency-graph assets are reproducible
        working-directory: zed-web-server.rs
        run: node scripts/build-graph-assets.mjs --check
      - name: Format
        working-directory: zed-web-server.rs
        run: cargo fmt --all -- --check
      - name: Test self-hosted dependency graph workspace
        working-directory: zed-web-server.rs
        run: |
          node --check assets/dependency-graph.js
          node tests/dependency-graph.mjs
      - name: Check all targets
        working-directory: zed-web-server.rs
        run: cargo check --locked --all-targets
      - name: Strict Clippy
        working-directory: zed-web-server.rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test with nextest
        working-directory: zed-web-server.rs
        run: cargo nextest run --locked
      - name: Documentation
        working-directory: zed-web-server.rs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Release build
        working-directory: zed-web-server.rs
        run: cargo build --locked --release
      - name: Enforce process-runtime boundaries
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib.rs
          test -f src/server.rs
          test -f src/browser_auth.rs
          test -f src/routes/console.rs
          test -f docs/shared-auth-pkce-bff.md
          test -f RUNTIME.md
          test "$(wc -l < src/main.rs)" -le 6
          git grep -qF 'pub async fn run' -- src/server.rs
          git grep -qF 'connect_with_retry' -- src/server.rs
          git grep -qF 'DatabaseStartupPolicy' -- src/server.rs
          git grep -qF 'connect_read_only_with_policy' -- src/server.rs
          git grep -qF '/api/v1/account/me' -- src/browser_auth.rs
          git grep -qF 'The API server remains the schema and' -- RUNTIME.md
          git grep -qF 'write-path authority' -- RUNTIME.md
          if git grep -nE 'DatabaseConnection|PgPoolOptions|routes::router|TcpListener::bind' -- src/main.rs; then
            echo 'database, routing, and listener lifecycle must remain outside src/main.rs' >&2
            exit 1
          fi
          git diff --check
