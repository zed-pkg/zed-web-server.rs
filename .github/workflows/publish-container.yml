name: publish container

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'static/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/publish-container.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'static/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/publish-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zed
          POSTGRES_DB: zed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zed -d zed"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout web source
        uses: actions/checkout@v4
        with:
          path: zed-web-server.rs
          persist-credentials: false

      - name: Checkout shared interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: main
          path: zed-interfaces
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the exact deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zed-web-server.rs/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ghcr.io/zed-pkg/zed-web-server:${{ github.sha }}
            ghcr.io/zed-pkg/zed-web-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the read-only UI image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name zed-web-smoke --network host \
            -e BIND_ADDR=127.0.0.1:48081 \
            -e DATABASE_URL=postgres://zed@127.0.0.1:5432/zed \
            -e PUBLIC_REGISTRY_URL=http://127.0.0.1:48080 \
            ghcr.io/zed-pkg/zed-web-server:${{ github.sha }}
          cleanup() {
            docker logs zed-web-smoke || true
            docker rm -f zed-web-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:48081/healthz && exit 0
            sleep 2
          done
          echo 'web image never became healthy' >&2
          exit 1

      - name: Push immutable and main tags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push ghcr.io/zed-pkg/zed-web-server:${{ github.sha }}
          docker push ghcr.io/zed-pkg/zed-web-server:main
