name: publish container

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/build-graph-assets.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'static/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/publish-container.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/build-graph-assets.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'static/**'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/publish-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A commit-tagged web image identifies every cross-repository Rust input.
  ZED_INTERFACES_SHA: 7d31f80dd8a310f218931165a3ad636a2f32b932
  ZED_LIB_CORE_SHA: c3d486a1519381276fbec02aa25247f542924443

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zed
          POSTGRES_DB: zed
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zed -d zed"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout web source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-web-server.rs
          persist-credentials: false

      - name: Checkout pinned shared interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false

      - name: Checkout pinned registry core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-lib-core
          ref: ${{ env.ZED_LIB_CORE_SHA }}
          path: zed-lib-core
          persist-credentials: false

      - name: Verify the complete source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
          test "$(git -C zed-lib-core rev-parse HEAD)" = "$ZED_LIB_CORE_SHA"
          cd zed-web-server.rs
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = Path("Cargo.lock").read_text()
          pins = {
              "zed-interfaces": (
                  "https://github.com/zed-pkg/zed-interfaces.git",
                  os.environ["ZED_INTERFACES_SHA"],
              ),
              "zed-orm-core": (
                  "https://github.com/zed-pkg/zed-lib-core.git",
                  os.environ["ZED_LIB_CORE_SHA"],
              ),
          }
          for package, (repository, revision) in pins.items():
              spec = manifest["dependencies"][package]
              assert "path" not in spec, spec
              assert spec["git"] == repository, spec
              assert spec["rev"] == revision, spec
              source = f"git+{repository}?rev={revision}#{revision}"
              assert source in lock, f"Cargo.lock does not pin {package} at {revision}"
          PY

      - name: Verify dependency-graph release inputs
        working-directory: zed-web-server.rs
        run: |
          node scripts/build-graph-assets.mjs --check
          node --check assets/dependency-graph.js
          node tests/dependency-graph.mjs

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the exact deployable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: zed-web-server.rs/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            ZED_WEB_REVISION=${{ github.sha }}
            ZED_INTERFACES_REVISION=${{ env.ZED_INTERFACES_SHA }}
            ZED_LIB_CORE_REVISION=${{ env.ZED_LIB_CORE_SHA }}
          tags: |
            ghcr.io/zed-pkg/zed-web-server:${{ github.sha }}
            ghcr.io/zed-pkg/zed-web-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify embedded image provenance
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/zed-pkg/zed-web-server:${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.zpkg.interfaces.revision" }}')" = "$ZED_INTERFACES_SHA"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "io.zpkg.core.revision" }}')" = "$ZED_LIB_CORE_SHA"

      - name: Start the read-only UI image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name zed-web-smoke --network host \
            -e BIND_ADDR=127.0.0.1:48081 \
            -e DATABASE_URL=postgres://zed@127.0.0.1:5432/zed \
            -e PUBLIC_REGISTRY_URL=http://127.0.0.1:48080 \
            "ghcr.io/zed-pkg/zed-web-server:${GITHUB_SHA}"

      - name: Wait for web health
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -qx zed-web-smoke; then
              echo 'web container exited before becoming healthy' >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:48081/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo 'web image never became healthy' >&2
          exit 1

      - name: Verify embedded dependency-graph representations
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          evidence="../smoke-diagnostics/graph-assets"
          mkdir -p "$evidence"
          for asset in js css; do
            for encoding in identity br; do
              prefix="$evidence/dependency-graph-${asset}-${encoding}"
              curl -fsS \
                -H "Accept-Encoding: ${encoding}" \
                -D "${prefix}.get.headers" \
                -o "${prefix}.body" \
                "http://127.0.0.1:48081/graph-assets/dependency-graph.${asset}"
              curl -fsS -I \
                -H "Accept-Encoding: ${encoding}" \
                -D "${prefix}.head.headers" \
                -o /dev/null \
                "http://127.0.0.1:48081/graph-assets/dependency-graph.${asset}"
              etag="$(sed -n 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//p' "${prefix}.get.headers" | tr -d '\r' | tail -n 1)"
              test -n "$etag"
              : > "${prefix}.304.body"
              status="$(curl -sS \
                -H "Accept-Encoding: ${encoding}" \
                -H "If-None-Match: ${etag}" \
                -D "${prefix}.304.headers" \
                -o "${prefix}.304.body" \
                -w '%{http_code}' \
                "http://127.0.0.1:48081/graph-assets/dependency-graph.${asset}")"
              test "$status" = 304
            done
            cmp "assets/dependency-graph.${asset}" \
              "$evidence/dependency-graph-${asset}-identity.body"
            cmp "static/dependency-graph.${asset}.br" \
              "$evidence/dependency-graph-${asset}-br.body"
          done
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path("../smoke-diagnostics/graph-assets")

          def headers(path: Path) -> dict[str, str]:
              result = {}
              for line in path.read_text().splitlines():
                  if ":" in line:
                      name, value = line.split(":", 1)
                      result[name.lower()] = value.strip()
              return result

          for asset in ("js", "css"):
              for encoding in ("identity", "br"):
                  prefix = evidence / f"dependency-graph-{asset}-{encoding}"
                  body = prefix.with_suffix(".body").read_bytes()
                  get = headers(Path(f"{prefix}.get.headers"))
                  head = headers(Path(f"{prefix}.head.headers"))
                  not_modified = headers(Path(f"{prefix}.304.headers"))
                  not_modified_body = Path(f"{prefix}.304.body").read_bytes()
                  expected_length = str(len(body))
                  assert not_modified_body == b""
                  assert get["content-length"] == expected_length
                  assert head["content-length"] == expected_length
                  assert not_modified["content-length"] == expected_length
                  assert get["etag"] == head["etag"] == not_modified["etag"]
                  assert get["etag"].startswith('"') and get["etag"].endswith('"')
                  for name in ("content-type", "cache-control", "vary"):
                      assert get[name] == head[name] == not_modified[name]
                  assert get["vary"].lower() == "accept-encoding"
                  assert "transfer-encoding" not in not_modified
                  if encoding == "br":
                      assert get["content-encoding"].lower() == "br"
                      assert get["content-encoding"] == head["content-encoding"] == not_modified["content-encoding"]
                  else:
                      assert "content-encoding" not in get
                      assert "content-encoding" not in head
                      assert "content-encoding" not in not_modified
          PY

      - name: Capture web smoke and provenance diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p smoke-diagnostics
          docker logs zed-web-smoke > smoke-diagnostics/container.log 2>&1
          docker inspect zed-web-smoke > smoke-diagnostics/container-inspect.json 2>&1
          docker image inspect "ghcr.io/zed-pkg/zed-web-server:${GITHUB_SHA}" \
            > smoke-diagnostics/image-inspect.json 2>&1
          docker ps -a > smoke-diagnostics/docker-ps.txt 2>&1
          printf 'web_revision=%s\ninterfaces_revision=%s\ncore_revision=%s\n' \
            "$GITHUB_SHA" "$ZED_INTERFACES_SHA" "$ZED_LIB_CORE_SHA" \
            > smoke-diagnostics/source-revisions.txt
          sed -n '1,240p' smoke-diagnostics/container.log

      - name: Remove web smoke container
        if: always()
        run: docker rm -f zed-web-smoke >/dev/null 2>&1 || true

      - name: Push immutable and compatibility tags
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          immutable="ghcr.io/zed-pkg/zed-web-server:${GITHUB_SHA}"
          push_output="$(docker push "$immutable")"
          printf '%s\n' "$push_output"
          digest="$(awk '$2 == "digest:" && $3 ~ /^sha256:/ {print $3}' <<<"$push_output" | tail -n 1)"
          [[ "$digest" == sha256:* ]] || { echo 'could not recover pushed image digest' >&2; exit 1; }
          docker push ghcr.io/zed-pkg/zed-web-server:main
          printf 'image=%s@%s\nweb_revision=%s\ninterfaces_revision=%s\ncore_revision=%s\n' \
            'ghcr.io/zed-pkg/zed-web-server' "$digest" "$GITHUB_SHA" "$ZED_INTERFACES_SHA" "$ZED_LIB_CORE_SHA" \
            > smoke-diagnostics/published-image.txt

      - name: Upload web smoke and provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zed-web-container-smoke
          path: smoke-diagnostics/
          if-no-files-found: error
          retention-days: 30
