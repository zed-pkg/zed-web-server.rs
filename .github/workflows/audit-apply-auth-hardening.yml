name: apply one-time auth hardening patch

on:
  push:
    branches:
      - audit/harden-auth-redirects-20260809

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'zed-pkg/zed-web-server.rs' && github.ref == 'refs/heads/audit/harden-auth-redirects-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/browser_auth.rs)" = "8577b273cdd521cf871a43fadbdedb01df219710"
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/browser_auth.rs")
          source = path.read_text(encoding="utf-8")

          decode_start = source.index("async fn decode_json")
          decode_end = source.index("\nfn same_origin_request", decode_start)
          failure_start = source.index("    if !status.is_success() {", decode_start, decode_end)
          failure_end = source.index("    response.json::<T>()", failure_start, decode_end)
          new_failure = r'''    if !status.is_success() {
              let response_bytes = response.content_length();
              let request_id = response
                  .headers()
                  .get("x-request-id")
                  .and_then(|value| value.to_str().ok())
                  .unwrap_or("<missing>");
              tracing::warn!(
                  %status,
                  %operation,
                  ?response_bytes,
                  %request_id,
                  "upstream authentication operation failed"
              );
              let mapped = if status == StatusCode::UNAUTHORIZED || status == StatusCode::FORBIDDEN {
                  StatusCode::UNAUTHORIZED
              } else if status.is_client_error() {
                  StatusCode::BAD_REQUEST
              } else {
                  StatusCode::BAD_GATEWAY
              };
              return Err(error_json(mapped, "authentication operation failed"));
          }
          '''
          source = source[:failure_start] + new_failure + source[failure_end:]

          sanitize_start = source.index("fn sanitize_return_to")
          sanitize_end = source.index("\nfn random_token", sanitize_start)
          new_sanitize = r'''fn sanitize_return_to(value: &str) -> String {
              if return_target_is_local(value) {
                  value.to_owned()
              } else {
                  default_return_to()
              }
          }

          fn return_target_is_local(value: &str) -> bool {
              let mut candidate = value.as_bytes().to_vec();
              for _ in 0..=8 {
                  let Ok(text) = std::str::from_utf8(&candidate) else {
                      return false;
                  };
                  if !text.starts_with('/')
                      || text.starts_with("//")
                      || text.starts_with("/\\")
                      || text
                          .chars()
                          .any(|character| character == '\\' || character == '#' || character.is_control())
                  {
                      return false;
                  }

                  let (decoded, changed) = percent_decode_once(text);
                  if !changed {
                      return true;
                  }
                  candidate = decoded;
              }
              false
          }

          fn percent_decode_once(value: &str) -> (Vec<u8>, bool) {
              let bytes = value.as_bytes();
              let mut output = Vec::with_capacity(bytes.len());
              let mut index = 0;
              let mut changed = false;
              while index < bytes.len() {
                  if bytes[index] == b'%' && index + 2 < bytes.len() {
                      if let (Some(high), Some(low)) =
                          (hex_nibble(bytes[index + 1]), hex_nibble(bytes[index + 2]))
                      {
                          output.push((high << 4) | low);
                          index += 3;
                          changed = true;
                          continue;
                      }
                  }
                  output.push(bytes[index]);
                  index += 1;
              }
              (output, changed)
          }
          '''
          source = source[:sanitize_start] + new_sanitize + source[sanitize_end:]

          test_start = source.index("    #[test]\n    fn return_targets_are_local_paths_only()")
          module_end = source.rfind("\n}")
          if module_end <= test_start:
              raise SystemExit("could not bound final browser-auth test module")
          new_tests = r'''    #[test]
              fn return_targets_are_local_paths_only() {
                  for valid in [
                      "/",
                      "/dashboard/acme?tab=1",
                      "/search?q=hello%20world",
                      "/search?next=%2Fpackages",
                  ] {
                      assert_eq!(sanitize_return_to(valid), valid);
                  }
                  for invalid in [
                      "https://evil.test",
                      "//evil.test",
                      "/\\evil.test",
                      "/ok#fragment",
                      "/ok\r\nLocation: bad",
                      "/ok\tbad",
                      "/%2Fevil.test",
                      "/%5Cevil.test",
                      "/%255cevil.test",
                      "/ok%23fragment",
                      "/ok%0Abad",
                      "/ok%250Abad",
                      "/ok%00bad",
                      "/ok%7Fbad",
                  ] {
                      assert_eq!(sanitize_return_to(invalid), "/");
                  }
              }

              #[test]
              fn authentication_failures_never_log_upstream_response_bodies() {
                  let source = include_str!("browser_auth.rs");
                  let body_log = ["body", " = %body"].concat();
                  let body_read = ["response", ".text().await"].concat();
                  assert!(!source.contains(&body_log));
                  assert!(!source.contains(&body_read));
              }
          '''
          source = source[:test_start] + new_tests + source[module_end:]

          path.write_text(source, encoding="utf-8")
          PY
          rustfmt --edition 2024 src/browser_auth.rs
          git diff --check
          git config user.name "ORESoftware audit hardening"
          git config user.email "11139560+ORESoftware@users.noreply.github.com"
          git add src/browser_auth.rs
          git rm .github/workflows/audit-apply-auth-hardening.yml
          git diff --cached --check
          git commit -m "fix(auth): reject ambiguous returns and redact upstream bodies"
          git push origin HEAD:audit/harden-auth-redirects-20260809
