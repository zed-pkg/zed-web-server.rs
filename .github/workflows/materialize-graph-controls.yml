name: materialize reviewed graph control repair

on:
  push:
    branches: [agent/den-3478-restore-filter-controls]
    paths: [.github/workflows/materialize-graph-controls.yml]

permissions:
  contents: write

concurrency:
  group: materialize-graph-controls
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-3478-restore-filter-controls
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Apply only the verified source repair and regenerate its Brotli representation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object assets/dependency-graph.js)" = aee9c57225cc97cbb4c57e7ae3db9f864ae19620
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { constants, brotliCompressSync, brotliDecompressSync } from 'node:zlib';
          let source = readFileSync('assets/dependency-graph.js', 'utf8');
          const replacements = [
            ['<input type="checkbox" data-kind="${kind}" checked> ${label}', '<input type="checkbox" data-kind="${kind}"${this.enabledKinds.has(kind) ? " checked" : ""}> ${label}'],
            ['<label><input type="checkbox" data-control="optional" checked> Optional edges</label>', '<label><input type="checkbox" data-control="optional"${this.includeOptional ? " checked" : ""}> Optional edges</label>'],
          ];
          for (const [before, after] of replacements) {
            assert.equal(source.split(before).length, 2, 'source match must be unique');
            source = source.replace(before, after);
          }
          const bytes = Buffer.from(source);
          const compressed = brotliCompressSync(bytes, { params: {
            [constants.BROTLI_PARAM_MODE]: constants.BROTLI_MODE_TEXT,
            [constants.BROTLI_PARAM_QUALITY]: 11,
            [constants.BROTLI_PARAM_SIZE_HINT]: bytes.byteLength,
          }});
          assert.ok(brotliDecompressSync(compressed).equals(bytes));
          writeFileSync('assets/dependency-graph.js', bytes);
          writeFileSync('static/dependency-graph.js.br', compressed);
          JS
          test "$(git hash-object assets/dependency-graph.js)" = ba7263980422600e917e2c0ac5ee0c412196170a
          node --check assets/dependency-graph.js
          node --test tests/dependency-graph-controls.mjs
          node scripts/build-graph-assets.mjs --check
          node tests/dependency-graph.mjs
          node scripts/check-claritas-component-bundle.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' assets/dependency-graph.js static/dependency-graph.js.br | sort)"
      - name: Commit only the repair and remove this materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/materialize-graph-controls.yml
          git add -- assets/dependency-graph.js static/dependency-graph.js.br
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(graph): render restored filter controls from view state'
          git push origin HEAD:refs/heads/agent/den-3478-restore-filter-controls
