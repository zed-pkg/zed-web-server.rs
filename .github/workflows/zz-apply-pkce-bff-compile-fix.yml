name: apply bounded PKCE BFF compile fixes

on:
  push:
    branches:
      - feat/den-2955-shared-auth-pkce-bff
  pull_request:
    branches:
      - agent/den-2955-app-zpkg-net
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pkce-bff-compile-fixes
  cancel-in-progress: false

env:
  ZED_INTERFACES_SHA: 07d01604461d00e237c7d86ad3855464167574ec

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/den-2955-shared-auth-pkce-bff
          path: zed-web-server.rs
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply assertion-checked fixes
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new))

          auth = Path("src/browser_auth.rs")
          replace_exact(
              auth,
              "        Ok(value) => response.headers_mut().append(header::SET_COOKIE, value),",
              "        Ok(value) => {\n"
              "            response.headers_mut().append(header::SET_COOKIE, value);\n"
              "        }",
          )

          old_auth_config = '''fn auth_config(state: &WebState) -> Result<&BrowserAuthConfig, Response> {
              state.browser_auth.as_ref().ok_or_else(|| {
                  error_json(
                      StatusCode::SERVICE_UNAVAILABLE,
                      "browser authentication is not configured",
                  )
              })
          }'''
          new_auth_config = '''fn auth_config(state: &WebState) -> Option<&BrowserAuthConfig> {
              state.browser_auth.as_ref()
          }

          fn auth_unavailable() -> Response {
              error_json(
                  StatusCode::SERVICE_UNAVAILABLE,
                  "browser authentication is not configured",
              )
          }'''
          replace_exact(auth, old_auth_config, new_auth_config)

          replace_exact(
              auth,
              '''    let config = match auth_config(&state) {
                  Ok(config) => config,
                  Err(response) => return response,
              };''',
              '''    let Some(config) = auth_config(&state) else {
                  return auth_unavailable();
              };''',
              expected=3,
          )
          replace_exact(
              auth,
              '''    let config = match auth_config(state) {
                  Ok(config) => config,
                  Err(response) => return response,
              };''',
              '''    let Some(config) = auth_config(state) else {
                  return auth_unavailable();
              };''',
          )
          replace_exact(
              auth,
              "    if value.len() % 2 != 0 {",
              "    if !value.len().is_multiple_of(2) {",
          )
          replace_exact(
              auth,
              "    let mut output = String::with_capacity(((bytes.len() + 2) / 3) * 4);",
              "    let mut output = String::with_capacity(bytes.len().div_ceil(3) * 4);",
          )

          proxy = Path("src/proxy.rs")
          replace_exact(
              proxy,
              "            session_path: \"/auth/browser/session\".into(),\n"
              "            http: client(),",
              "            session_path: \"/auth/browser/session\".into(),\n"
              "            browser_auth: None,\n"
              "            http: client(),",
          )

          server = Path("src/server.rs")
          replace_exact(
              server,
              "    if session_signing_secret.as_bytes().len() < 32 {",
              "    if session_signing_secret.len() < 32 {",
          )

          for obsolete in (
              Path("ci-bff-check.txt"),
              Path(".github/workflows/zz-apply-pkce-bff-compile-fix.yml"),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY
      - name: Validate the complete source graph
        working-directory: zed-web-server.rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Commit validated fixes
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-2955): validate the complete PKCE BFF"
          git push origin HEAD:feat/den-2955-shared-auth-pkce-bff
