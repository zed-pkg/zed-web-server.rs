name: one-shot DEN-390 dotenv regression repair

on:
  push:
    branches:
      - fix/DEN-390-runtime-dotenv-boundary-20260910
    paths:
      - '.github/workflows/repair-DEN-390-dotenv-regression.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Remove self-matching regression needle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/server.rs')
          text = path.read_text()
          old = '''    #[test]\n    fn runtime_does_not_implicitly_load_working_directory_dotenv() {\n        let source = include_str!("server.rs");\n        assert!(!source.contains("dotenvy::dotenv"));\n    }\n'''
          new = '''    #[test]\n    fn runtime_does_not_implicitly_load_working_directory_dotenv() {\n        let source = include_str!("server.rs");\n        let legacy_loader = concat!("dotenvy", "::dotenv");\n        assert!(!source.contains(legacy_loader));\n\n        let contract = include_str!("../.cli-flags.toml");\n        assert!(contract.lines().any(|line| line.trim() == "dotenv = false"));\n        assert!(contract.lines().any(|line| line.trim() == "files = []"));\n    }\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- src/server.rs
          git diff -- src/server.rs

      - name: Delete repair lane and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-390-dotenv-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.rs .github/workflows/repair-DEN-390-dotenv-regression.yml
          git diff --cached --check
          git commit -m 'test(DEN-390): avoid self-matching dotenv regression'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push https://github.com/zed-pkg/zed-web-server.rs.git \
            HEAD:fix/DEN-390-runtime-dotenv-boundary-20260910
