name: compose MASH account console

on:
  push:
    branches:
      - feat/den-2955-mash-account-console
    paths:
      - .github/workflows/compose-account-console.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compose-account-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose:
    if: github.repository == 'zed-pkg/zed-web-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Compose account routes, read-only DB policy, and lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          routes = Path('src/routes.rs')
          text = routes.read_text()
          old = '.route("/", get(home))'
          new = '.route("/", get(crate::account::home))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one public home route, found {text.count(old)}')
          text = text.replace(old, new)
          old = 'async fn home(State(state): State<Arc<WebState>>) -> Html<String> {'
          new = 'pub(crate) async fn public_home(State(state): State<Arc<WebState>>) -> Html<String> {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one home handler, found {text.count(old)}')
          routes.write_text(text.replace(old, new))

          server = Path('src/server.rs')
          text = server.read_text()
          old = '''    let connect = url
              .parse::<PgConnectOptions>()?
              .options([("statement_timeout", policy.statement_timeout_ms.to_string())]);'''
          new = '''    let connect = url.parse::<PgConnectOptions>()?.options([
              ("statement_timeout", policy.statement_timeout_ms.to_string()),
              ("default_transaction_read_only", "on".to_owned()),
          ]);'''
          if text.count(old) != 1:
              raise SystemExit('could not find PgConnectOptions construction')
          text = text.replace(old, new)
          old = '    Ok(SqlxPostgresConnector::from_sqlx_postgres_pool(pool))'
          new = '''    let database = SqlxPostgresConnector::from_sqlx_postgres_pool(pool);
              zed_orm::assert_read_only(&database).await?;
              Ok(database)'''
          if text.count(old) != 1:
              raise SystemExit('could not find database pool return')
          text = text.replace(old, new)
          old = '''        registry_url: std::env::var("PUBLIC_REGISTRY_URL")
              .unwrap_or_else(|_| zed_interfaces::registry::DEFAULT_REGISTRY_URL.to_string()),
              shared_auth_url: shared_auth_url(std::env::var("SHARED_AUTH_URL").ok().as_deref()),'''
          new = '''        registry_url: std::env::var("PUBLIC_REGISTRY_URL")
              .unwrap_or_else(|_| zed_interfaces::registry::DEFAULT_REGISTRY_URL.to_string()),
              api_url: std::env::var("ZED_API_URL")
                  .unwrap_or_else(|_| "http://127.0.0.1:8080".to_owned())
                  .trim_end_matches('/')
                  .to_owned(),
              public_origin: std::env::var("PUBLIC_WEB_ORIGIN")
                  .unwrap_or_else(|_| "http://localhost:8081".to_owned())
                  .trim_end_matches('/')
                  .to_owned(),
              session_cookie_name: std::env::var("AUTH_SESSION_COOKIE_NAME")
                  .unwrap_or_else(|_| "__Host-ore-session".to_owned()),
              shared_auth_url: shared_auth_url(std::env::var("SHARED_AUTH_URL").ok().as_deref()),'''
          if text.count(old) != 1:
              raise SystemExit('could not find WebState construction')
          text = text.replace(old, new)
          old = '    let app = crate::routes::router(state);'
          new = '''    let app = crate::routes::router(state.clone()).merge(crate::account::router(state));'''
          if text.count(old) != 1:
              raise SystemExit('could not find router composition')
          text = text.replace(old, new)
          text = text.replace(
              '//! The API server remains the schema owner. This read-only web process may',
              '//! `zed-lib` owns the schema. This read-only web process may',
          )
          server.write_text(text)
          PY
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src
          git commit -m 'feat(DEN-2955): compose the MASH account console runtime'
          git push origin HEAD:${GITHUB_REF_NAME}
