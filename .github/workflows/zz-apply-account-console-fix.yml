name: apply account console compile fixes

on:
  push:
    branches:
      - feat/den-2955-mash-account-console
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-account-console-compile-fixes
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply assertion-checked semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once_or_accept_current(path: Path, stale: str, current: str) -> None:
              text = path.read_text()
              stale_count = text.count(stale)
              current_count = text.count(current)
              if stale_count == 1 and current_count == 0:
                  path.write_text(text.replace(stale, current, 1))
              elif stale_count == 0 and current_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f"{path}: ambiguous repair state "
                      f"(stale={stale_count}, current={current_count})"
                  )

          proxy = Path("src/proxy.rs")
          replace_once_or_accept_current(
              proxy,
              (
                  "            registry_url: \"https://registry.zpkg.net\".into(),\n"
                  "            shared_auth_url,"
              ),
              (
                  "            registry_url: \"https://registry.zpkg.net\".into(),\n"
                  "            api_url: \"http://127.0.0.1:8081\".into(),\n"
                  "            public_origin: \"http://localhost:8080\".into(),\n"
                  "            session_cookie_name: \"zed_session\".into(),\n"
                  "            shared_auth_url,"
              ),
          )

          routes = Path("src/routes.rs")
          text = routes.read_text()
          stale = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            shared_auth_url: None,"
          )
          current = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            api_url: \"http://127.0.0.1:8081\".into(),\n"
              "            public_origin: \"http://localhost:8080\".into(),\n"
              "            session_cookie_name: \"zed_session\".into(),\n"
              "            shared_auth_url: None,"
          )
          stale_count = text.count(stale)
          current_count = text.count(current)
          if stale_count == 2 and current_count == 0:
              routes.write_text(text.replace(stale, current))
          elif stale_count == 0 and current_count == 2:
              pass
          else:
              raise SystemExit(
                  "src/routes.rs: ambiguous WebState repair state "
                  f"(stale={stale_count}, current={current_count})"
              )

          account = Path("src/account.rs")
          text = account.read_text()
          replacements = [
              ("use axum::routing::{get, post};", "use axum::routing::get;"),
              (
                  "fn account_home_page(state: &WebState, home: HomeResponse) -> Html<String> {",
                  "fn account_home_page(_state: &WebState, home: HomeResponse) -> Html<String> {",
              ),
              (
                  "value=(user.display_name.unwrap_or_default());",
                  "value=(user.display_name.as_deref().unwrap_or_default());",
              ),
              (
                  "value=(user.avatar_url.unwrap_or_default());",
                  "value=(user.avatar_url.as_deref().unwrap_or_default());",
              ),
              (
                  "fn require_same_origin(headers: &HeaderMap, state: &WebState) -> Result<(), Response> {",
                  "fn require_same_origin(\n    headers: &HeaderMap,\n    state: &WebState,\n) -> Result<(), Box<Response>> {",
              ),
              (
                  "        Err(simple_page(\n            state,\n            None,\n            StatusCode::FORBIDDEN,\n            \"Request rejected\",\n            \"The form origin did not match this registry console.\",\n        ))",
                  "        Err(Box::new(simple_page(\n            state,\n            None,\n            StatusCode::FORBIDDEN,\n            \"Request rejected\",\n            \"The form origin did not match this registry console.\",\n        )))",
              ),
          ]
          for stale, current in replacements:
              stale_count = text.count(stale)
              current_count = text.count(current)
              if stale_count == 1 and current_count == 0:
                  text = text.replace(stale, current, 1)
              elif stale_count == 0 and current_count == 1:
                  pass
              else:
                  raise SystemExit(
                      "src/account.rs: ambiguous repair state for "
                      f"{stale!r} (stale={stale_count}, current={current_count})"
                  )

          origin_stale = (
              "    if let Err(response) = require_same_origin(&headers, &state) {\n"
              "        return response;\n"
              "    }"
          )
          origin_current = (
              "    if let Err(response) = require_same_origin(&headers, &state) {\n"
              "        return *response;\n"
              "    }"
          )
          stale_count = text.count(origin_stale)
          current_count = text.count(origin_current)
          if stale_count == 7 and current_count == 0:
              text = text.replace(origin_stale, origin_current)
          elif stale_count == 0 and current_count == 7:
              pass
          else:
              raise SystemExit(
                  "src/account.rs: ambiguous same-origin call-site state "
                  f"(stale={stale_count}, current={current_count})"
              )

          dead_fields = [
              "    id: String,\n",
              "    aal: u8,\n",
              "    org_id: String,\n",
              "    project_slug: Option<String>,\n",
          ]
          expected_counts = {
              "    id: String,\n": 3,
              "    aal: u8,\n": 1,
              "    org_id: String,\n": 2,
              "    project_slug: Option<String>,\n": 1,
          }
          for field in dead_fields:
              count = text.count(field)
              expected = expected_counts[field]
              if count != expected:
                  raise SystemExit(
                      f"src/account.rs: expected {expected} unused field occurrence(s) "
                      f"for {field!r}, found {count}"
                  )
              text = text.replace(field, "")

          account.write_text(text)

          for obsolete in (
              Path(".github/workflows/diagnose-account-console-check.yml"),
              Path(".github/workflows/fix-account-console-compile.yml"),
              Path(".github/workflows/zz-apply-account-console-fix.yml"),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit the validated patch without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          git fetch origin feat/den-2955-mash-account-console
          remote_head="$(git rev-parse origin/feat/den-2955-mash-account-console)"
          if test "$tested_head" != "$remote_head"; then
            echo "The feature branch advanced during validation; refusing an untested overwrite." >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-2955): stabilize the Maud account console"
          git push origin HEAD:feat/den-2955-mash-account-console
