name: apply account console compile fixes

on:
  push:
    branches:
      - feat/den-2955-mash-account-console
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-account-console-compile-fixes
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply assertion-checked semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, stale: str, current: str, label: str) -> str:
              count = text.count(stale)
              if count != 1:
                  raise SystemExit(f"{label}: expected one stale form, found {count}")
              return text.replace(stale, current, 1)

          proxy = Path("src/proxy.rs")
          text = proxy.read_text()
          text = replace_once(
              text,
              (
                  "            registry_url: \"https://registry.zpkg.net\".into(),\n"
                  "            shared_auth_url,"
              ),
              (
                  "            registry_url: \"https://registry.zpkg.net\".into(),\n"
                  "            api_url: \"http://127.0.0.1:8081\".into(),\n"
                  "            public_origin: \"http://localhost:8080\".into(),\n"
                  "            session_cookie_name: \"zed_session\".into(),\n"
                  "            shared_auth_url,"
              ),
              "src/proxy.rs WebState fixture",
          )
          proxy.write_text(text)

          routes = Path("src/routes.rs")
          text = routes.read_text()
          stale = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            shared_auth_url: None,"
          )
          current = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            api_url: \"http://127.0.0.1:8081\".into(),\n"
              "            public_origin: \"http://localhost:8080\".into(),\n"
              "            session_cookie_name: \"zed_session\".into(),\n"
              "            shared_auth_url: None,"
          )
          if text.count(stale) != 2:
              raise SystemExit(
                  f"src/routes.rs: expected two stale WebState fixtures, found {text.count(stale)}"
              )
          routes.write_text(text.replace(stale, current))

          account = Path("src/account.rs")
          text = account.read_text()
          scalar_replacements = [
              ("use axum::routing::{get, post};", "use axum::routing::get;", "routing import"),
              (
                  "fn account_home_page(state: &WebState, home: HomeResponse) -> Html<String> {",
                  "fn account_home_page(_state: &WebState, home: HomeResponse) -> Html<String> {",
                  "account home state",
              ),
              (
                  "value=(user.display_name.unwrap_or_default());",
                  "value=(user.display_name.as_deref().unwrap_or_default());",
                  "display name borrow",
              ),
              (
                  "value=(user.avatar_url.unwrap_or_default());",
                  "value=(user.avatar_url.as_deref().unwrap_or_default());",
                  "avatar URL borrow",
              ),
              (
                  "fn require_same_origin(headers: &HeaderMap, state: &WebState) -> Result<(), Response> {",
                  "fn require_same_origin(\n    headers: &HeaderMap,\n    state: &WebState,\n) -> Result<(), Box<Response>> {",
                  "same-origin result type",
              ),
              (
                  "        Err(simple_page(\n            state,\n            None,\n            StatusCode::FORBIDDEN,\n            \"Request rejected\",\n            \"The form origin did not match this registry console.\",\n        ))",
                  "        Err(Box::new(simple_page(\n            state,\n            None,\n            StatusCode::FORBIDDEN,\n            \"Request rejected\",\n            \"The form origin did not match this registry console.\",\n        )))",
                  "same-origin boxed response",
              ),
          ]
          for stale, current, label in scalar_replacements:
              text = replace_once(text, stale, current, f"src/account.rs {label}")

          origin_stale = (
              "    if let Err(response) = require_same_origin(&headers, &state) {\n"
              "        return response;\n"
              "    }"
          )
          origin_current = (
              "    if let Err(response) = require_same_origin(&headers, &state) {\n"
              "        return *response;\n"
              "    }"
          )
          if text.count(origin_stale) != 7:
              raise SystemExit(
                  "src/account.rs: expected seven same-origin call sites, "
                  f"found {text.count(origin_stale)}"
              )
          text = text.replace(origin_stale, origin_current)

          struct_replacements = [
              (
                  """struct UserResponse {
              id: String,
              subject: String,
              email: Option<String>,
              display_name: Option<String>,
              avatar_url: Option<String>,
              settings: Value,
              aal: u8,
          }""".replace("          ", ""),
                  """struct UserResponse {
              subject: String,
              email: Option<String>,
              display_name: Option<String>,
              avatar_url: Option<String>,
              settings: Value,
          }""".replace("          ", ""),
                  "UserResponse",
              ),
              (
                  """struct OrgResponse {
              id: String,
              slug: String,
              name: String,
              description: Option<String>,
              role: String,
          }""".replace("          ", ""),
                  """struct OrgResponse {
              slug: String,
              name: String,
              description: Option<String>,
              role: String,
          }""".replace("          ", ""),
                  "OrgResponse",
              ),
              (
                  """struct ProjectResponse {
              id: String,
              org_id: String,
              org_slug: String,
              slug: String,
              name: String,
              description: Option<String>,
              role: String,
          }""".replace("          ", ""),
                  """struct ProjectResponse {
              id: String,
              org_slug: String,
              slug: String,
              name: String,
              description: Option<String>,
              role: String,
          }""".replace("          ", ""),
                  "ProjectResponse",
              ),
              (
                  """struct PackageResponse {
              id: String,
              org_id: String,
              org_slug: String,
              project_id: Option<String>,
              project_slug: Option<String>,
              name: String,
              description: Option<String>,
              visibility: String,
              repo_url: String,
              config: Value,
          }""".replace("          ", ""),
                  """struct PackageResponse {
              org_slug: String,
              project_id: Option<String>,
              name: String,
              description: Option<String>,
              visibility: String,
              repo_url: String,
              config: Value,
          }""".replace("          ", ""),
                  "PackageResponse",
              ),
          ]
          for stale, current, label in struct_replacements:
              text = replace_once(text, stale, current, f"src/account.rs {label}")
          account.write_text(text)

          for obsolete in (
              Path(".github/workflows/diagnose-account-console-check.yml"),
              Path(".github/workflows/fix-account-console-compile.yml"),
              Path(".github/workflows/zz-apply-account-console-fix.yml"),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit the validated patch without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          git fetch origin feat/den-2955-mash-account-console
          remote_head="$(git rev-parse origin/feat/den-2955-mash-account-console)"
          if test "$tested_head" != "$remote_head"; then
            echo "The feature branch advanced during validation; refusing an untested overwrite." >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-2955): stabilize the Maud account console"
          git push origin HEAD:feat/den-2955-mash-account-console
