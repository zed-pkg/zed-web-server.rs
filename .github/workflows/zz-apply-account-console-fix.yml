name: apply account console compile fixes

on:
  push:
    branches:
      - feat/den-2955-mash-account-console
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-account-console-compile-fixes
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply assertion-checked semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("src/proxy.rs")
          text = proxy.read_text()
          old = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            shared_auth_url,"
          )
          new = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            api_url: \"http://127.0.0.1:8081\".into(),\n"
              "            public_origin: \"http://localhost:8080\".into(),\n"
              "            session_cookie_name: \"zed_session\".into(),\n"
              "            shared_auth_url,"
          )
          if text.count(old) != 1:
              raise SystemExit(f"src/proxy.rs: expected one stale WebState constructor, found {text.count(old)}")
          proxy.write_text(text.replace(old, new, 1))

          routes = Path("src/routes.rs")
          text = routes.read_text()
          old = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            shared_auth_url: None,"
          )
          new = (
              "            registry_url: \"https://registry.zpkg.net\".into(),\n"
              "            api_url: \"http://127.0.0.1:8081\".into(),\n"
              "            public_origin: \"http://localhost:8080\".into(),\n"
              "            session_cookie_name: \"zed_session\".into(),\n"
              "            shared_auth_url: None,"
          )
          if text.count(old) != 2:
              raise SystemExit(f"src/routes.rs: expected two stale WebState constructors, found {text.count(old)}")
          routes.write_text(text.replace(old, new))

          account = Path("src/account.rs")
          text = account.read_text()
          replacements = [
              ("use axum::routing::{get, post};", "use axum::routing::get;", 1),
              ("fn account_home_page(state: &WebState, home: HomeResponse) -> Html<String> {", "fn account_home_page(_state: &WebState, home: HomeResponse) -> Html<String> {", 1),
              ("value=(user.display_name.unwrap_or_default());", "value=(user.display_name.as_deref().unwrap_or_default());", 1),
              ("value=(user.avatar_url.unwrap_or_default());", "value=(user.avatar_url.as_deref().unwrap_or_default());", 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"src/account.rs: expected {expected} occurrence(s) of {old!r}, found {count}")
              text = text.replace(old, new, expected)
          account.write_text(text)

          obsolete = Path(".github/workflows/diagnose-account-console-check.yml")
          if obsolete.exists():
              obsolete.unlink()
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Commit the validated patch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-2955): stabilize the Maud account console"
          git push origin HEAD:feat/den-2955-mash-account-console
