name: k8s contract

on:
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s-contract.yml']
  pull_request:
    paths: ['k8s/**', '.github/workflows/k8s-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Render primary zpkg.net hosts
        run: kubectl kustomize k8s > /tmp/zpkg-net.yaml

      - name: Render AWS overlay
        run: kubectl kustomize k8s/overlays/aws > /tmp/aws.yaml

      - name: Render Hetzner overlay
        run: kubectl kustomize k8s/overlays/hetzner > /tmp/hetzner.yaml

      - name: Verify workload contract
        shell: bash
        run: |
          set -euo pipefail
          for rendered in /tmp/aws.yaml /tmp/hetzner.yaml; do
            grep -q 'replicas: 2' "$rendered"
            grep -q 'image: ghcr.io/zed-pkg/zed-web-server:main' "$rendered"
          done

      - name: Verify cloud-local API and web hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in user.zpkg.net app.zpkg.net web.zpkg.net; do
            test "$(grep -c "host: $host" /tmp/zpkg-net.yaml)" -eq 1
            grep -q -- "- $host" /tmp/zpkg-net.yaml
          done
          test "$(grep -c 'name: dd-zed-web-server' /tmp/zpkg-net.yaml)" -ge 4
          grep -q 'registry.aws.zpkg.net' /tmp/aws.yaml
          grep -q 'host: web.aws.zpkg.net' /tmp/aws.yaml
          grep -q 'registry.hetzner.zpkg.net' /tmp/hetzner.yaml
          grep -q 'host: web.hetzner.zpkg.net' /tmp/hetzner.yaml
