name: k8s contract

on:
  push:
    branches: [main]
    paths: ['k8s/**', '.github/workflows/k8s-contract.yml']
  pull_request:
    paths: ['k8s/**', '.github/workflows/k8s-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render AWS and Hetzner overlays
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize k8s/overlays/aws > /tmp/aws.yaml
          kubectl kustomize k8s/overlays/hetzner > /tmp/hetzner.yaml
          grep -q 'registry.aws.zpkg.tech' /tmp/aws.yaml
          grep -q 'host: aws.zpkg.tech' /tmp/aws.yaml
          grep -q 'registry.hetzner.zpkg.tech' /tmp/hetzner.yaml
          grep -q 'host: hetzner.zpkg.tech' /tmp/hetzner.yaml
          for rendered in /tmp/aws.yaml /tmp/hetzner.yaml; do
            grep -q 'replicas: 2' "$rendered"
            grep -q 'image: ghcr.io/zed-pkg/zed-web-server:main' "$rendered"
          done
