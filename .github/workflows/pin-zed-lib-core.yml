name: pin canonical zed-lib-core

on:
  push:
    branches:
      - agent/den-2955-app-zpkg-net
    paths:
      - Cargo.toml
      - .github/workflows/pin-zed-lib-core.yml

permissions:
  contents: write

concurrency:
  group: pin-zed-lib-core-${{ github.ref }}
  cancel-in-progress: false

env:
  CORE_SHA: d9a1f72baad87a0bbe256ad892d61d7a4fdd9135
  INTERFACES_SHA: 07d01604461d00e237c7d86ad3855464167574ec

jobs:
  pin-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the web branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-2955-app-zpkg-net
          path: zed-web-server.rs
          fetch-depth: 0
      - name: Check out the immutable interfaces dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.INTERFACES_SHA }}
          path: zed-interfaces
          persist-credentials: false
      - name: Install the certified Rust toolchain surface
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Regenerate the immutable lock graph and verify it
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p zed-orm-core --precise "$CORE_SHA"
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          grep -F "git+https://github.com/zed-pkg/zed-lib-core.git?rev=$CORE_SHA#$CORE_SHA" Cargo.lock
      - name: Commit the verified lock graph and remove this one-shot workflow
        working-directory: zed-web-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pin-zed-lib-core.yml
          git add Cargo.toml Cargo.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No lock graph changes were needed.'
            exit 0
          fi
          git commit -m 'build(DEN-2955): pin the certified zed-lib-core graph'
          git push origin HEAD:agent/den-2955-app-zpkg-net
