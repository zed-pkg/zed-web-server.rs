name: capture PKCE BFF compiler diagnostics

on:
  push:
    branches:
      - feat/den-2955-shared-auth-pkce-bff
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-pkce-bff
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          cargo check --locked --all-targets >ci-bff-check.txt 2>&1
          status=$?
          printf '\nexit=%s\n' "$status" >>ci-bff-check.txt
          rm -f .github/workflows/zz-diagnose-pkce-bff.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(DEN-2955): record PKCE BFF compiler diagnostics"
          git push origin HEAD:feat/den-2955-shared-auth-pkce-bff
