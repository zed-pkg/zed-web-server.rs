name: Container entrypoint and multi-arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-entrypoint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify host and container Rust compiler authority
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          dockerfile = Path("Dockerfile").read_text()
          image = re.search(r"(?m)^FROM rust:([^\s]+) AS build$", dockerfile)
          override = re.search(r"(?m)^ENV RUSTUP_TOOLCHAIN=([^\s]+)$", dockerfile)
          assert image, "missing Rust build-stage image"
          assert override, "missing RUSTUP_TOOLCHAIN build override"
          assert image.group(1) == f"{toolchain}-slim-bookworm", (image.group(1), toolchain)
          assert override.group(1) == toolchain, (override.group(1), toolchain)
      - name: Verify SOPS required-secret, literal-value, environment, exec, and argv-layout contracts
        run: node --test scripts/sops-entrypoint.test.mjs scripts/container-argv.test.mjs

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Stage the documented parent build context
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/zed-web-context"
          mkdir -p "$context/zed-web-server.rs"
          tar --exclude=.git -cf - . | tar -xf - -C "$context/zed-web-server.rs"
          echo "CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Build with docker build
        run: docker build --progress=plain --file "$CONTEXT/zed-web-server.rs/Dockerfile" --tag zed-web-server:ci "$CONTEXT"
      - name: Verify image execution metadata
        shell: bash
        run: |
          set -euo pipefail
          entrypoint="$(docker image inspect zed-web-server:ci --format '{{json .Config.Entrypoint}}')"
          cmd="$(docker image inspect zed-web-server:ci --format '{{json .Config.Cmd}}')"
          echo "Config.Entrypoint=${entrypoint} Config.Cmd=${cmd}"
          test "$entrypoint" = '["/usr/local/bin/sops-entrypoint.sh","/usr/local/bin/zed-web-server"]'
          # The image builder omits an empty CMD from the image config, so the
          # Dockerfile's `CMD []` inspects as null. Either spelling means "no
          # default arguments"; anything else would be replaced by runtime args.
          case "$cmd" in
            null | '[]') ;;
            *) echo "::error::image CMD must be empty, found ${cmd}"; exit 1 ;;
          esac
      - name: Verify runtime arguments reach the binary through the wrapper
        shell: bash
        run: |
          set -euo pipefail
          # `docker create` resolves the process argv exactly as `docker run`
          # (and a Kubernetes `args:` list) would, without starting the service.
          expect_argv() {
            local expected_args="$1"
            shift
            local id path args
            id="$(docker create zed-web-server:ci "$@")"
            path="$(docker container inspect "$id" --format '{{json .Path}}')"
            args="$(docker container inspect "$id" --format '{{json .Args}}')"
            docker rm "$id" > /dev/null
            echo "runtime args [$*] -> Path=${path} Args=${args}"
            test "$path" = '"/usr/local/bin/sops-entrypoint.sh"'
            test "$args" = "$expected_args"
          }
          expect_argv '["/usr/local/bin/zed-web-server"]'
          expect_argv '["/usr/local/bin/zed-web-server","--extra-runtime-flag"]' --extra-runtime-flag

  buildx-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Stage the documented parent build context
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/zed-web-context"
          mkdir -p "$context/zed-web-server.rs"
          tar --exclude=.git -cf - . | tar -xf - -C "$context/zed-web-server.rs"
          echo "CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Build amd64 and arm64 OCI image
        run: |
          docker buildx build \
            --file "$CONTEXT/zed-web-server.rs/Dockerfile" \
            --platform linux/amd64,linux/arm64 \
            --progress=plain \
            --output type=oci,dest=/tmp/zed-web-server.oci.tar \
            "$CONTEXT"
          test -s /tmp/zed-web-server.oci.tar
