name: apply one-time auth clippy correction

on:
  push:
    branches:
      - audit/harden-auth-redirects-20260809

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'zed-pkg/zed-web-server.rs' && github.ref == 'refs/heads/audit/harden-auth-redirects-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the exact strict-Clippy correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/browser_auth.rs)" = "8d4947dd539ef5943381a96de03dbcda63d9ebbe"
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/browser_auth.rs")
          source = path.read_text(encoding="utf-8")
          function_start = source.index("fn percent_decode_once")
          conditional_start = source.index("        if bytes[index] == b'%'", function_start)
          conditional_end = source.index("        output.push(bytes[index]);", conditional_start)
          replacement = r'''        if bytes[index] == b'%'
              && index + 2 < bytes.len()
              && let (Some(high), Some(low)) =
                  (hex_nibble(bytes[index + 1]), hex_nibble(bytes[index + 2]))
          {
              output.push((high << 4) | low);
              index += 3;
              changed = true;
              continue;
          }
          '''
          source = source[:conditional_start] + replacement + source[conditional_end:]
          path.write_text(source, encoding="utf-8")
          PY
          rustfmt --edition 2024 src/browser_auth.rs
          git diff --check
          git config user.name "ORESoftware audit hardening"
          git config user.email "11139560+ORESoftware@users.noreply.github.com"
          git add src/browser_auth.rs
          git rm .github/workflows/audit-fix-auth-clippy.yml
          git diff --cached --check
          git commit -m "fix(auth): satisfy strict clippy in percent decoder"
          git push origin HEAD:audit/harden-auth-redirects-20260809
