name: one-shot DEN-390 runtime dotenv repair

on:
  push:
    branches:
      - fix/DEN-390-runtime-dotenv-boundary-20260910
    paths:
      - '.github/workflows/repair-DEN-390-runtime-dotenv.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconcile executable and TOML dotenv boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          contract_path = Path('.cli-flags.toml')
          contract = contract_path.read_text()
          assert '[env]\nfiles = []\n' in contract
          assert 'dotenv = false' not in contract
          contract = contract.replace('[env]\nfiles = []\n', '[env]\ndotenv = false\nfiles = []\n', 1)
          contract_path.write_text(contract)

          server_path = Path('src/server.rs')
          server = server_path.read_text()
          legacy_runtime = '    dotenvy::dotenv().ok();\n'
          assert server.count(legacy_runtime) == 1
          server = server.replace(legacy_runtime, '', 1)
          marker = '    #[test]\n    fn database_policy_defaults_preserve_the_existing_runtime_contract() {'
          regression = '''    #[test]\n    fn runtime_does_not_implicitly_load_working_directory_dotenv() {\n        let source = include_str!("server.rs");\n        assert!(!source.contains("dotenvy::dotenv"));\n    }\n\n'''
          assert marker in server
          assert 'fn runtime_does_not_implicitly_load_working_directory_dotenv()' not in server
          server = server.replace(marker, regression + marker, 1)
          server_path.write_text(server)

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text()
          direct = 'dotenvy = "0.15"\n'
          assert cargo.count(direct) == 1
          cargo_path.write_text(cargo.replace(direct, '', 1))

          lock_path = Path('Cargo.lock')
          lock = lock_path.read_text()
          root_marker = '[[package]]\nname = "zed-web-server"\n'
          start = lock.index(root_marker)
          end = lock.find('\n[[package]]\n', start + len(root_marker))
          assert end != -1
          root = lock[start:end]
          dep_line = ' "dotenvy",\n'
          assert root.count(dep_line) == 1
          root = root.replace(dep_line, '', 1)
          lock_path.write_text(lock[:start] + root + lock[end:])

          parsed_contract = tomllib.loads(contract_path.read_text())
          assert parsed_contract['env']['dotenv'] is False
          assert parsed_contract['env']['files'] == []
          parsed_cargo = tomllib.loads(cargo_path.read_text())
          assert 'dotenvy' not in parsed_cargo['dependencies']
          parsed_lock = tomllib.loads(lock_path.read_text())
          roots = [p for p in parsed_lock['package'] if p['name'] == 'zed-web-server']
          assert len(roots) == 1
          assert 'dotenvy' not in roots[0]['dependencies']
          final_server = server_path.read_text()
          assert 'dotenvy::dotenv()' not in final_server
          assert 'runtime_does_not_implicitly_load_working_directory_dotenv' in final_server
          PY
          git diff --check -- .cli-flags.toml Cargo.toml Cargo.lock src/server.rs
          git diff -- .cli-flags.toml Cargo.toml Cargo.lock src/server.rs

      - name: Remove one-shot lane and push reviewed result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm .github/workflows/repair-DEN-390-runtime-dotenv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cli-flags.toml Cargo.toml Cargo.lock src/server.rs .github/workflows/repair-DEN-390-runtime-dotenv.yml
          git diff --cached --check
          git commit -m 'fix(DEN-390): make web runtime honor no-dotenv contract'
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push https://github.com/zed-pkg/zed-web-server.rs.git \
            HEAD:fix/DEN-390-runtime-dotenv-boundary-20260910
