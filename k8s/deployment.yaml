# dd-zed-web-server — the zed-pkg registry web UI (Maud/axum/htmx, read-only).
#
# Layer-2 (app-owned) manifest: namespace-scoped ONLY. The `zed` Namespace, its
# ResourceQuota/LimitRange and the default-deny NetworkPolicy are Layer-1, owned by
# ORESoftware/k8s-cluster (remote/argocd/projects/zed.tenant.yaml). Do NOT add a
# Namespace/ClusterRole/CRD here — the `zed` AppProject enforces
# clusterResourceWhitelist: [] and the sync will fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-zed-web-server
  namespace: zed
  labels:
    app: dd-zed-web-server
    app.kubernetes.io/name: dd-zed-web-server
    app.kubernetes.io/part-of: zed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dd-zed-web-server
  template:
    metadata:
      labels:
        app: dd-zed-web-server
        app.kubernetes.io/name: dd-zed-web-server
        app.kubernetes.io/part-of: zed
    spec:
      # Read-only UI over the same Postgres; never calls the k8s API.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: benefactor-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zed-web-server
          # `main` is a MUTABLE tag: with IfNotPresent a node holding an older
          # cached `main` never re-pulls, so replicas can serve different
          # builds. `Always` converges every pod start on the current image;
          # pinning by digest in the GitOps overlay is the durable fix.
          image: ghcr.io/zed-pkg/zed-web-server:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - { name: BIND_ADDR, value: "0.0.0.0:8081" }
            - { name: PUBLIC_REGISTRY_URL, value: "https://registry.zpkg.tech" }
            - { name: RUST_LOG, value: "info" }
            # TEMPORARY bootstrap database shared with the registry API.
            # Restore the ExternalSecret before enabling durable production
            # metadata.
            - { name: DATABASE_URL, value: "postgres://zed@zed-postgres.zed.svc.cluster.local:5432/zed" }
          # The UI degrades gracefully without the DB (offline banner), so
          # /healthz stays 200 through a DB blip — neither probe flaps on it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: tmp
          emptyDir: {}
