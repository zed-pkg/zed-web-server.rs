# Secrets for dd-zed-web-server, materialized by External Secrets Operator.
#
# Layer-2 (app-owned), namespace-scoped. The ClusterSecretStore itself is
# Layer-1 and lives in ORESoftware/k8s-cluster. One Secret per owning service
# (never share a target Secret name across services under prune+selfHeal).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dd-zed-web-secrets
  namespace: zed
  labels:
    app.kubernetes.io/part-of: zed
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: dd-zed-web-secrets
    creationPolicy: Owner
  data:
    # Read-only Postgres DSN (a read-only DB role is preferred for the UI).
    - secretKey: ZED_WEB_DATABASE_URL
      remoteRef:
        key: dd/remote-dev/zed-secrets
        property: ZED_WEB_DATABASE_URL
