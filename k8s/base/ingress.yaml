# Public hosts for the registry web UI. Layer-2 per the contract; the
# ingress-nginx controller + cert-manager ClusterIssuer are Layer-1. DNS lives
# in zed-infra/terraform/cloudflare — keep records DNS-only until the
# certificate is issued (ACME HTTP-01 ordering).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-zed-web-server
  namespace: zed
  labels:
    app: dd-zed-web-server
    app.kubernetes.io/part-of: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "20"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [web.zpkg.net]
      secretName: zed-web-server-tls
  rules:
    - host: web.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-web-server
                port:
                  number: 8081
