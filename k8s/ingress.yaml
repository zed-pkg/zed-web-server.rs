# Public hosts for the registry web UI. Layer-2 per the contract; the
# ingress-nginx controller + cert-manager ClusterIssuer are Layer-1. DNS lives
# in zed-infra/terraform/cloudflare — keep records DNS-only until the
# certificate is issued (ACME HTTP-01 ordering).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-zed-web-server
  namespace: zed
  labels:
    app: dd-zed-web-server
    app.kubernetes.io/part-of: zed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [www.zpkg.tech, zpkg.tech]
      secretName: zed-web-server-tls
  rules:
    - host: www.zpkg.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-web-server
                port:
                  number: 8081
    - host: zpkg.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dd-zed-web-server
                port:
                  number: 8081
