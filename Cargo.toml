[package]
name = "zed-web-server"
version = "0.1.0"
edition = "2024"
description = "zed-pkg registry web UI: MASH stack (Maud, Axum, SeaORM, HTMX)"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-web-server.rs"

[dependencies]
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "f141e4cfae31a74c679b46d1d4bb0146b20555f6" }
zed-orm = { git = "https://github.com/zed-pkg/zed-lib.git", rev = "c924cc61689c62d5df8f4cb190fa09f7f513f644", package = "zed-orm" }
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
maud = "0.27"
percent-encoding = "2"
# No default features: no auto-redirects wanted and proxied auth pages must
# pass through byte-for-byte. `json` is for the first-party account API and
# `stream` pipes Shared Auth responses back verbatim.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Enables sea-orm's MockDatabase in tests only (not pulled into release builds).
sea-orm = { version = "1", features = ["mock"] }
