[package]
name = "zed-web-server"
version = "0.1.0"
edition = "2024"
description = "zed-pkg registry web UI: MASH stack (Maud, Axum, SeaORM, HTMX)"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-web-server.rs"

[dependencies]
# CI checks the exact interface repository out as a sibling. Its repository
# root is now a virtual polyglot workspace; path consumers must select the Rust
# package slice explicitly.
zed-interfaces = { path = "../zed-interfaces/src/rust" }
# Default features only: the read-only surface. Enabling `read-write` here
# would hand this process write symbols its database identity cannot use.
# Pin the certified canonical data-plane revision; never follow a moving branch
# in a production server lock graph.
zed-orm-core = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "d9a1f72baad87a0bbe256ad892d61d7a4fdd9135" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
maud = "0.27"
# No default features: no auto-redirects wanted (policy is set to none at
# construction anyway) and auth pages must pass through byte-for-byte, so no
# decompression either. `stream` is for piping upstream bodies back verbatim.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
