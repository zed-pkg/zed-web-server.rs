[package]
name = "zed-web-server"
version = "0.1.0"
edition = "2024"
description = "zed-pkg registry web UI: MASH stack (Maud, Axum, SeaORM, HTMX)"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-web-server.rs"

[dependencies]
zed-interfaces = { path = "../zed-interfaces" }
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
maud = "0.27"
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
